name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Playwright n'est pas une dépendance du widget : installé ici seulement
      # pour exécuter tests/e2e.test.mjs (ignoré sans lui).
      - name: Installer Playwright et Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.64.0
          npx playwright install --with-deps chromium
      - name: Tests
        # Le rapport « spec » finit par la liste des tests en échec, avec leur message : on la lit sans fouiller le rapport TAP
        # (six mille lignes, dont les échecs sont au milieu).
        run: node --test --test-reporter=spec
        env:
          # Échoue si le test navigateur ne peut pas démarrer, au lieu de l'ignorer.
          REQUIRE_E2E: '1'
