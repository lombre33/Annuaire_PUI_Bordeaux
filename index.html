<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Annuaire - Contacts</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- HEADER -->
    <header class="header">
      <div class="header-left">
        <h1 class="logo">📋 Annuaire</h1>
        <p class="subtitle">Répertoire de contacts</p>
      </div>
      <div class="header-right">
        <input 
          type="text" 
          id="searchInput" 
          class="search-input" 
          placeholder="Rechercher par nom, fonction, structure..."
        >
      </div>
    </header>

    <!-- FILTERS SECTION -->
    <div class="filters-section">
      <div class="filter-bubbles" id="filterBubbles"></div>
      <button id="resetFilters" class="reset-btn">✕ Réinitialiser</button>
    </div>

    <!-- ACTIVE FILTERS CHIPS -->
    <div class="active-filters" id="activeFiltersChips"></div>

    <!-- RESULTS COUNT -->
    <div class="results-info">
      <span id="resultCount">0 contacts</span>
    </div>

    <!-- CARDS GRID -->
    <div class="cards-container">
      <div class="cards-grid" id="cardsGrid"></div>
      <div class="empty-state" id="emptyState">
        <p>Aucun contact ne correspond à votre recherche.</p>
      </div>
    </div>
  </div>

  <!-- CARD TEMPLATE -->
  <template id="cardTemplate">
    <div class="card">
      <div class="card-avatar-section">
        <img class="card-avatar" src="" alt="">
      </div>
      <div class="card-content">
        <h3 class="card-name"></h3>
        <p class="card-fonction"></p>
        <p class="card-structure"></p>
        <a class="card-email" href=""></a>
        <p class="card-tel"></p>
      </div>
      <div class="card-tags"></div>
    </div>
  </template>

  <!-- SCRIPTS - ORDER MATTERS! -->
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <script src="app.js"></script>
</body>
</html>
