<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Annuaire - Grist Widget</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header avec recherche -->
  <div class="header">
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Rechercher par nom, prénom, fonction...">
      <span id="contactCount" class="contact-count"></span>
    </div>
    <div class="filter-controls">
      <button id="toggleFilters" class="btn-toggle-filters">🔽 Filtres</button>
      <button id="resetFilters" class="btn-reset">⟲ Réinitialiser</button>
    </div>
  </div>

  <!-- Panneau de filtres (horizontal) -->
  <div id="filtersPanel" class="filters-panel">
    <div id="filtersList" class="filters-list"></div>
  </div>

  <!-- Grille de contacts -->
  <div id="contactsGrid" class="contacts-grid"></div>

  <!-- Scripts -->
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <script src="app.js"></script>
</body>
</html>
