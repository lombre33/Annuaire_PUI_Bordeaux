<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Annuaire - Grist Widget</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Bandeau de filtres horizontal -->
  <div id="filtersPanel" class="filters-panel">
    <div class="filters-header">
      <button id="toggleFilters" class="toggle-filters">🔽 Filtres</button>
      <button id="resetFilters" class="reset-filters">↻ Réinitialiser</button>
    </div>
    <div id="filtersContainer" class="filters-container"></div>
  </div>

  <!-- Barre de recherche -->
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Rechercher par nom, prénom, fonction, structure...">
    <span id="resultCount" class="result-count">0 contacts</span>
  </div>

  <!-- Grille de cartes -->
  <div id="cardsGrid" class="cards-grid"></div>

  <!-- État vide -->
  <div id="emptyState" class="empty-state" hidden>
    <p>Aucun contact ne correspond à vos critères.</p>
  </div>

  <!-- Scripts -->
  <!-- Charger Grist en premier -->
  <script src="https://grist.incubateur.net/grist-plugin-api.js"></script>
  <!-- Ensuite style et app -->
  <script src="style.js"></script>
  <script src="app.js"></script>
</body>
</html>
