<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Annuaire - Grist Widget</title>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="filtersPanel" class="filters-panel"><div class="filters-header"><button id="toggleFilters" class="toggle-filters" type="button">🔽 Filtres</button><button id="resetFilters" class="reset-filters" type="button">↻ Réinitialiser</button></div><div id="filtersContainer" class="filters-container"></div></div>
  <div class="search-bar"><input type="search" id="searchInput" placeholder="Rechercher par nom, prénom, fonction, structure..." autocomplete="off"><span id="resultCount" class="result-count">0 contacts</span></div>
  <div id="cardsGrid" class="cards-grid"></div><div id="emptyState" class="empty-state" hidden><p>Aucun contact ne correspond à vos critères.</p></div>
  <template id="cardTemplate"><article class="contact-card"><img class="avatar" alt=""><div class="card-content"><div class="name"></div><div class="fonction"></div><div class="structure"></div><a class="email"></a><div class="tel"></div><div class="card-tags"></div></div></article></template>
  <script src="app.js"></script>
</body>
</html>
