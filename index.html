<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Annuaire - Contacts</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- HEADER -->
    <header class="header">
      <div class="header-content">
        <div class="logo-section">
          <h1 class="logo">📇 Annuaire</h1>
          <p class="subtitle">Répertoire de contacts</p>
        </div>
        <div class="search-section">
          <input type="text" id="searchInput" class="search-input" placeholder="Rechercher par nom, fonction, structure...">
          <svg class="search-icon" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor">
            <circle cx="8" cy="8" r="7"/>
            <path d="M13 13l4 4"/>
          </svg>
        </div>
      </div>
    </header>

    <!-- FILTER BANNER -->
    <div class="filter-banner">
      <div class="filter-banner-content">
        <div class="filter-categories" id="filterCategories">
          <!-- Categories will be rendered here -->
        </div>
        <div class="filter-actions">
          <button id="resetFilters" class="btn-reset" title="Réinitialiser les filtres">
            ✕ Réinitialiser
          </button>
        </div>
      </div>
    </div>

    <!-- MAIN CONTENT -->
    <main class="main-content">
      <!-- ACTIVE FILTERS DISPLAY -->
      <div class="active-filters-display" id="activeFiltersDisplay"></div>

      <!-- RESULTS INFO -->
      <div class="results-header">
        <span id="resultCount" class="result-count">0 contacts</span>
      </div>

      <!-- CARDS GRID -->
      <div class="cards-grid" id="cardsGrid"></div>

      <!-- EMPTY STATE -->
      <div class="empty-state" id="emptyState" hidden>
        <div class="empty-state-icon">📭</div>
        <h3>Aucun contact trouvé</h3>
        <p>Modifiez vos filtres ou votre recherche</p>
      </div>
    </main>
  </div>

  <!-- CARD TEMPLATE -->
  <template id="cardTemplate">
    <div class="card">
      <div class="card-avatar">
        <div class="avatar-placeholder">👤</div>
      </div>
      <div class="card-content">
        <h3 class="card-name"></h3>
        <p class="card-fonction"></p>
        <p class="card-structure"></p>
        <div class="card-contact">
          <a class="card-email" href="#"></a>
          <span class="card-tel"></span>
        </div>
      </div>
      <div class="card-tags"></div>
    </div>
  </template>

  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <script src="app.js"></script>
</body>
</html>
