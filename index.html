<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Annuaire - Contacts</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- HEADER -->
  <header class="app-header">
    <div class="header-content">
      <div class="header-left">
        <h1 class="app-title">📄 Annuaire</h1>
        <p class="app-subtitle">Répertoire de contacts</p>
      </div>
      <div class="header-right">
        <div class="search-wrapper">
          <span class="search-icon">🔍</span>
          <input
            type="text"
            id="searchInput"
            class="search-input"
            placeholder="Rechercher par nom, fonction, structure..."
          />
        </div>
      </div>
    </div>
  </header>

  <!-- FILTER BUBBLES -->
  <div class="filters-section">
    <div id="filterBubbles" class="filter-bubbles"></div>
    <button id="resetFilters" class="reset-btn">✕ Réinitialiser</button>
  </div>

  <!-- ACTIVE FILTERS CHIPS -->
  <div id="activeFilters" class="active-filters"></div>

  <!-- MAIN CONTENT -->
  <main class="app-main">
    <!-- RESULT COUNT -->
    <div class="results-header">
      <span id="resultCount" class="result-count">0 contacts</span>
    </div>

    <!-- EMPTY STATE -->
    <div id="emptyState" class="empty-state" hidden>
      <p>🔍 Aucun contact ne correspond à votre recherche</p>
    </div>

    <!-- CARDS GRID -->
    <div id="cardsGrid" class="cards-grid"></div>
  </main>

  <!-- CARD TEMPLATE -->
  <template id="cardTemplate">
    <div class="contact-card">
      <div class="card-header">
        <div class="card-avatar"></div>
      </div>
      <div class="card-body">
        <h3 class="card-name"></h3>
        <p class="card-fonction"></p>
        <p class="card-structure"></p>
        <a class="card-email" href="#"></a>
        <p class="card-tel"></p>
      </div>
      <div class="card-tags"></div>
    </div>
  </template>

  <script src="app.js"></script>
</body>
</html>
